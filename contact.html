<!DOCTYPE html>
<html>
<head>
    <title>Contact Me</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #f4f4f4;
            color: #333;
        }

        header {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 25px;
        }

        nav {
            background-color: #555;
            text-align: center;
            padding: 15px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 15px;
        }

        .contact {
            background-color: white;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            border-radius: 8px;
        }

        .contact input,
        .contact textarea {
            width: 100%;
            padding: 10px;
            margin: 8px 0 15px;
            box-sizing: border-box;
        }

        .contact button {
            background-color: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            cursor: pointer;
        }

        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 15px;
            margin-top: 30px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Contact Me</h1>
        <p>Get in touch with me</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="portfolio.html">Portfolio</a>
        <a href="about.html">About</a>
        <a href="gallery.html">Projects</a>
        <a href="contact.html">Contact</a>
    </nav>

    <section class="contact">
        <h2>Contact Form</h2>

        <form>
            <label>Name:</label>
            <input type="text" name="name">

            <label>Email:</label>
            <input type="email" name="email">

            <label>Message:</label>
            <textarea name="message" rows="5"></textarea>

            <button type="submit">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 AIML Student Portfolio</p>
    </footer>

</body>
</html>
